name: Runtime image build

on:
  push:
    branches: [main, Dev]
    paths:
      - "docker/runtime/**"
      - "docker/feature-builder/**"
      - "scripts/build_runtime_image.py"
      - "scripts/snapshot_runtime_sources.py"
      - "src/af3_binder_filter/backends.py"
      - "src/af3_binder_filter/config.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-build.yml"
  schedule:
    # Saturday 02:00 Asia/Shanghai; validates base-image and package drift.
    - cron: "0 18 * * 5"
  workflow_dispatch:
    inputs:
      image_suffix:
        description: "Optional safe suffix for aerith/fold-runtime:ci-<suffix>"
        required: false
        type: string

permissions:
  contents: read

# This group is shared with gpu-smoke.yml so a local Docker build and GPU smoke
# never contend for the same single-host Docker data root.
concurrency:
  group: aerith-runtime-host
  cancel-in-progress: false

jobs:
  build:
    name: Build verified runtime image
    runs-on: [self-hosted, linux, x64, aerith-build]
    timeout-minutes: 360
    env:
      AERITH_RUNTIME_SOURCE_BUNDLE: ${{ vars.AERITH_RUNTIME_SOURCE_BUNDLE }}
      AERITH_RUNTIME_BUILD_CONFIG: ${{ vars.AERITH_RUNTIME_BUILD_CONFIG }}
      AERITH_RUNTIME_BUILDKIT_CACHE_DIR: ${{ vars.AERITH_RUNTIME_BUILDKIT_CACHE_DIR }}
      AERITH_RUNTIME_BUILD_LOCK: ${{ vars.AERITH_RUNTIME_BUILD_LOCK }}
      AERITH_RUNTIME_BUILDX_BUILDER: aerith-runtime-ci
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked build environment
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked --dev
      - name: Preflight source bundle, disk, and tag
        shell: bash
        run: |
          set -euo pipefail
          : "${AERITH_RUNTIME_SOURCE_BUNDLE:?Set repository variable AERITH_RUNTIME_SOURCE_BUNDLE}"
          : "${AERITH_RUNTIME_BUILD_CONFIG:?Set repository variable AERITH_RUNTIME_BUILD_CONFIG}"
          : "${AERITH_RUNTIME_BUILDKIT_CACHE_DIR:?Set repository variable AERITH_RUNTIME_BUILDKIT_CACHE_DIR}"
          test -d "$AERITH_RUNTIME_SOURCE_BUNDLE"
          test -f "$AERITH_RUNTIME_BUILD_CONFIG"
          mkdir -p "$AERITH_RUNTIME_BUILDKIT_CACHE_DIR"
          free_gib="$(df -Pk "$AERITH_RUNTIME_BUILDKIT_CACHE_DIR" | awk 'NR == 2 {print int($4 / 1024 / 1024)}')"
          if (( free_gib < 150 )); then
            echo "need at least 150 GiB free beside the BuildKit cache; found ${free_gib} GiB" >&2
            exit 2
          fi
          suffix="${{ inputs.image_suffix }}"
          suffix="${suffix:-${GITHUB_SHA}}"
          if [[ ! "$suffix" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "image_suffix contains unsupported characters: $suffix" >&2
            exit 2
          fi
          echo "RUNTIME_IMAGE=aerith/fold-runtime:ci-${suffix}" >> "$GITHUB_ENV"
          if builder_info="$(docker buildx inspect "$AERITH_RUNTIME_BUILDX_BUILDER" 2>/dev/null)"; then
            builder_driver="$(awk '$1 == "Driver:" {print $2; exit}' <<< "$builder_info")"
            if [[ "$builder_driver" != "docker-container" ]]; then
              echo "Buildx builder $AERITH_RUNTIME_BUILDX_BUILDER uses unsupported driver: ${builder_driver:-unknown}" >&2
              exit 2
            fi
            docker buildx use "$AERITH_RUNTIME_BUILDX_BUILDER"
          else
            docker buildx create \
              --name "$AERITH_RUNTIME_BUILDX_BUILDER" \
              --driver docker-container \
              --use
          fi
          docker buildx inspect "$AERITH_RUNTIME_BUILDX_BUILDER" --bootstrap
      - name: Verify immutable source bundle
        run: >-
          uv run python scripts/snapshot_runtime_sources.py verify
          "$AERITH_RUNTIME_SOURCE_BUNDLE"
      - name: Print reproducible build plan
        run: >-
          uv run python scripts/build_runtime_image.py
          --config "$AERITH_RUNTIME_BUILD_CONFIG"
          --source-bundle "$AERITH_RUNTIME_SOURCE_BUNDLE"
          --image "$RUNTIME_IMAGE"
          --cache-dir "$AERITH_RUNTIME_BUILDKIT_CACHE_DIR"
          --builder "$AERITH_RUNTIME_BUILDX_BUILDER"
          --dry-run
      - name: Build and record candidate
        shell: bash
        run: |
          set -euo pipefail
          lock="${AERITH_RUNTIME_BUILD_LOCK:-${AERITH_RUNTIME_BUILDKIT_CACHE_DIR}/aerith-runtime-build.lock}"
          mkdir -p "$(dirname "$lock")"
          exec 9>"$lock"
          flock -n 9
          uv run python scripts/build_runtime_image.py \
            --config "$AERITH_RUNTIME_BUILD_CONFIG" \
            --source-bundle "$AERITH_RUNTIME_SOURCE_BUNDLE" \
            --image "$RUNTIME_IMAGE" \
            --cache-dir "$AERITH_RUNTIME_BUILDKIT_CACHE_DIR" \
            --builder "$AERITH_RUNTIME_BUILDX_BUILDER"
          image_id="$(docker image inspect --format '{{.Id}}' "$RUNTIME_IMAGE")"
          docker image tag "$image_id" aerith/fold-runtime:ci-candidate
          {
            echo "### Runtime image candidate"
            echo
            echo "- tag: \`$RUNTIME_IMAGE\`"
            echo "- immutable image ID: \`$image_id\`"
            echo "- source bundle: \`$AERITH_RUNTIME_SOURCE_BUNDLE\`"
          } >> "$GITHUB_STEP_SUMMARY"
