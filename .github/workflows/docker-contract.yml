name: Docker contract

on:
  push:
    paths:
      - "docker/runtime/**"
      - "docker/feature-builder/**"
      - "scripts/build_runtime_image.py"
      - "scripts/runtime_sources.py"
      - "src/af3_binder_filter/backends.py"
      - "src/af3_binder_filter/runtime_sources.py"
      - ".github/workflows/docker-contract.yml"
  pull_request:
    paths:
      - "docker/runtime/**"
      - "docker/feature-builder/**"
      - "scripts/build_runtime_image.py"
      - "scripts/runtime_sources.py"
      - "src/af3_binder_filter/backends.py"
      - "src/af3_binder_filter/runtime_sources.py"
      - ".github/workflows/docker-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Source lock and Dockerfile contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked --dev
      - name: Validate source lock and build identities
        run: uv run python scripts/runtime_sources.py metadata
      - name: Check staged runtime Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          contexts="$RUNNER_TEMP/aerith-empty-contexts"
          mkdir -p "$contexts"/{af3,protenix,opendde,esm,openfold}
          docker build --check \
            --build-context "af3-src=$contexts/af3" \
            --build-context "protenix-src=$contexts/protenix" \
            --build-context "opendde-src=$contexts/opendde" \
            --build-context "esm-src=$contexts/esm" \
            --build-context "openfold-src=$contexts/openfold" \
            --file docker/runtime/Dockerfile .
      - name: Check digest assembly Dockerfile
        run: >-
          docker build --check
          --file docker/runtime/Dockerfile.assemble
          --build-arg RUNTIME_BASE_IMAGE=alpine:3.20
          --build-arg UV_COMPONENT_IMAGE=alpine:3.20
          --build-arg CONDA_COMPONENT_IMAGE=alpine:3.20
          .
