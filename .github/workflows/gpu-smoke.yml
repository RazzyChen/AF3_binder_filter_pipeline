name: GPU golden smoke and promotion

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Private GHCR candidate; blank uses aerith-fold-runtime:candidate"
        required: false
        type: string
      suites:
        description: "Secondary-backend golden suites to run serially"
        required: true
        default: both
        type: choice
        options: [both, opendde, protenix]
      promote:
        description: "Promote this exact digest after smoke and environment approval"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Required only when promote=true, for example 2026.07.29"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: aerith-gpu-smoke-host
  cancel-in-progress: false

jobs:
  golden:
    name: Golden AF3 cross-validation smoke
    runs-on: [self-hosted, linux, x64, aerith-gpu]
    timeout-minutes: 720
    outputs:
      digest: ${{ steps.smoke.outputs.digest }}
      repository: ${{ steps.smoke.outputs.repository }}
    env:
      AERITH_GPU_SMOKE_CONFIG: ${{ vars.AERITH_GPU_SMOKE_CONFIG }}
      AERITH_GPU_SMOKE_CONTRACT: ${{ vars.AERITH_GPU_SMOKE_CONTRACT }}
      AERITH_GPU_SMOKE_ROOT: ${{ vars.AERITH_GPU_SMOKE_ROOT }}
      AERITH_GPU_SMOKE_LOCK: ${{ vars.AERITH_GPU_SMOKE_LOCK }}
      UV_PYTHON: "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked smoke environment
        run: uv sync --locked --dev
      - name: Log in to private GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Exclusively run Docker doctor and golden suites
        id: smoke
        shell: bash
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
          SELECTED_SUITES: ${{ inputs.suites }}
          PROMOTE: ${{ inputs.promote }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          : "${AERITH_GPU_SMOKE_CONFIG:?Set repository variable AERITH_GPU_SMOKE_CONFIG}"
          : "${AERITH_GPU_SMOKE_CONTRACT:?Set repository variable AERITH_GPU_SMOKE_CONTRACT}"
          : "${AERITH_GPU_SMOKE_ROOT:?Set repository variable AERITH_GPU_SMOKE_ROOT}"
          if [[ "$PROMOTE" == true && ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "promote=true requires a safe release_tag" >&2
            exit 2
          fi
          mkdir -p "$AERITH_GPU_SMOKE_ROOT"
          lock="${AERITH_GPU_SMOKE_LOCK:-${AERITH_GPU_SMOKE_ROOT}/gpu-smoke.lock}"
          mkdir -p "$(dirname "$lock")"
          exec 9>"$lock"
          flock -n 9
          busy="$(nvidia-smi --query-compute-apps=pid --format=csv,noheader,nounits | sed -n "/[^[:space:]]/p")"
          if [[ -n "$busy" ]]; then
            echo "GPU smoke requires an idle host; active compute PIDs: $busy" >&2
            exit 75
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          requested_image="${REQUESTED_IMAGE:-ghcr.io/$owner/aerith-fold-runtime:candidate}"
          expected_repository="ghcr.io/$owner/aerith-fold-runtime"
          if [[ "$requested_image" != "$expected_repository:"* \
            && "$requested_image" != "$expected_repository@"* ]]; then
            echo "GPU smoke only accepts candidates from $expected_repository" >&2
            exit 2
          fi
          digest="$(docker buildx imagetools inspect "$requested_image" \
            | sed -n "s/^Digest:[[:space:]]*//p" | head -n 1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "could not resolve registry digest for $requested_image" >&2
            exit 2
          fi
          repository="${requested_image%@*}"
          reference_tail="${repository##*/}"
          if [[ "$reference_tail" == *:* ]]; then
            repository="${repository%:*}"
          fi
          docker pull "$repository@$digest"
          image_id="$(docker image inspect --format "{{.Id}}" "$repository@$digest")"
          uv run python scripts/verify_runtime_image.py --image "$image_id"
          docker run --rm --gpus all --network none "$image_id" doctor

          case "$SELECTED_SUITES" in
            both) backends=(opendde protenix) ;;
            opendde|protenix) backends=("$SELECTED_SUITES") ;;
            *) echo "unsupported suite selection: $SELECTED_SUITES" >&2; exit 2 ;;
          esac
          export AERITH_GPU_SMOKE_IMAGE="$image_id"
          export AERITH_GPU_SMOKE_AERITH_COMMAND="aerith"
          for backend in "${backends[@]}"; do
            export AERITH_GPU_SMOKE_BACKEND="$backend"
            uv run pytest -q -m integration tests/test_gpu_smoke_contract.py
          done
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### GPU golden smoke passed"
            echo
            echo "- immutable candidate: \`$repository@$digest\`"
            echo "- suites: \`${backends[*]}\`"
            echo "- contract: \`$AERITH_GPU_SMOKE_CONTRACT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Approve and publish release tag
    needs: golden
    if: inputs.promote
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: runtime-release
    steps:
      - name: Log in to private GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Promote the exact tested manifest
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ needs.golden.outputs.repository }}
          SOURCE_DIGEST: ${{ needs.golden.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          target="ghcr.io/$owner/aerith-fold-runtime"
          docker buildx imagetools create \
            --tag "$target:$RELEASE_TAG" \
            --tag "$target:stable" \
            "$SOURCE_REPOSITORY@$SOURCE_DIGEST"
          {
            echo "### Runtime promoted"
            echo
            echo "- release: \`$target:$RELEASE_TAG\`"
            echo "- stable: \`$target:stable\`"
            echo "- immutable source: \`$SOURCE_REPOSITORY@$SOURCE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
