[project]
name = "aerith"
version = "0.1.0"
description = "AlphaFold 3 binder candidate orchestration pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biotite>=1.0",
    "hydra-core>=1.3,<2",
    "numpy>=1.26",
    "omegaconf>=2.3,<3",
    "pydantic>=2.0",
    "pyyaml>=6,<7",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
aerith = "af3_binder_filter.cli:main"

[dependency-groups]
dev = [
    "deptry==0.24.0",
    "pytest>=8.0",
    "ruff==0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/af3_binder_filter"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires real Docker, AF3, ESM, GPU, or cluster paths",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.deptry]
known_first_party = ["af3_binder_filter"]
extend_exclude = ["docker"]
package_module_name_map = { "hydra-core" = "hydra", "pyyaml" = "yaml" }
